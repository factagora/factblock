[project]
name = "factblock"
version = "1.0.0a1"
description = "Agent memory for decisions: extract dated claims and their causal links into a temporal causal knowledge graph you can read as of any instant"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Factagora", email = "randy@factagora.com" }]
requires-python = ">=3.11"
dependencies = ["pyarrow>=17"]
keywords = ["knowledge-graph", "bitemporal", "agent-memory", "parquet", "arrow", "as-of"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/factagora/factblock"
Specification = "https://github.com/factagora/factblock/blob/main/SPEC.md"
Changelog = "https://github.com/factagora/factblock/blob/main/CHANGELOG.md"
Issues = "https://github.com/factagora/factblock/issues"
Hosted = "https://docs.tckg.factagora.com"

[project.scripts]
factblock = "factblock.__main__:main"

[project.optional-dependencies]
gemini = ["google-genai>=1.62"]   # factblock extract --provider gemini (GEMINI_API_KEY, or Vertex via GOOGLE_GENAI_USE_VERTEXAI=1)
openai = ["openai>=1.50"]         # --provider openai, and any OpenAI-compatible server through OPENAI_BASE_URL

[dependency-groups]
dev = ["duckdb>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factblock"]
