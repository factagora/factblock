[project]
name = "factblock"
version = "1.0.0a12"
description = "An open format for claims and their history: build agent memory that tracks claims, evidence and changes, and lets you query what was known at any point in time. Temporal causal knowledge graphs in portable files"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Factagora", email = "randy@factagora.com" }]
requires-python = ">=3.11"
dependencies = ["pyarrow>=17"]
keywords = ["knowledge-graph", "bitemporal", "agent-memory", "parquet", "arrow", "as-of"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/factagora/factblock"
Specification = "https://github.com/factagora/factblock/blob/main/SPEC.md"
Changelog = "https://github.com/factagora/factblock/blob/main/CHANGELOG.md"
Issues = "https://github.com/factagora/factblock/issues"
Hosted = "https://docs.tckg.factagora.com"

[project.scripts]
factblock = "factblock.__main__:run"

[project.optional-dependencies]
gemini = ["google-genai>=1.62"]   # extract --provider gemini, recall --embed gemini (GEMINI_API_KEY, or Vertex via GOOGLE_GENAI_USE_VERTEXAI=1)
openai = ["openai>=1.50"]         # --provider openai, recall --embed openai, and any OpenAI-compatible server through OPENAI_BASE_URL
viz = ["vl-convert-python>=1.7"]  # Timeline.save(".png" or ".svg"); .html needs nothing
demo = ["rich>=13"]               # factblock demo: the animated walkthrough behind samples/demo.gif

[dependency-groups]
dev = ["duckdb>=1.1", "rich>=13"]   # rich: tests/test_demo.py

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factblock"]

[tool.hatch.build.targets.wheel.force-include]
"samples/rates" = "factblock/samples/rates"   # `factblock sample` copies it; the repo keeps one copy at samples/
