[project]
name = "factblock"
version = "1.0.0a1"
description = "FactBlock table format: validator and as-of reader (Arrow out)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pyarrow>=17"]

[dependency-groups]
dev = ["duckdb>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factblock"]
