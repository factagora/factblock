[project]
name = "factblock"
version = "1.0.0a1"
description = "FactBlock table format: validator, as-of reader (Arrow out), resolve, Parquet writer, Graphiti adapter"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Factagora", email = "randy@factagora.com" }]
requires-python = ">=3.11"
dependencies = ["pyarrow>=17"]
keywords = ["knowledge-graph", "bitemporal", "agent-memory", "parquet", "arrow", "as-of"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/factagora/factblock"
Specification = "https://github.com/factagora/factblock/blob/main/SPEC.md"

[project.scripts]
factblock = "factblock.__main__:main"

[dependency-groups]
dev = ["duckdb>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factblock"]
