name: release
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: for t in tests/test_*.py; do uv run python $t; done
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
