name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python tests/test_rates.py
      - run: uv run python tests/test_graphiti_adapter.py
      - run: uv run python tests/test_duckdb.py
      - run: uv run python tests/test_extract.py
      - run: uv run python tests/test_why.py
